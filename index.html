                    <p className="text-xs text-slate-300 mt-2 leading-relaxed">{t.microdrama.feature4Desc}</p>
                  </div>
                </div>

                {/* Vertical Series Showcase (9:16 Aspect) */}
                <div className="mt-16">
                  <h3 className="text-2xl font-bold text-center mb-8 flex items-center justify-center gap-2">
                    <i data-lucide="play-circle" className="w-6 h-6 text-onda-orange"></i>
                    {t.microdrama.showcaseTitle}
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto">
                    {MICRODRAMA_SERIES.map((drama) => (
                      <div key={drama.id} className="bg-slate-800 rounded-3xl overflow-hidden border border-slate-700 shadow-xl group flex flex-col justify-between">
                        <div>
                          {/* Vertical 9:16 Frame Aspect */}
                          <div className="relative aspect-[9/16] overflow-hidden bg-slate-950">
                            <img 
                              src={drama.poster} 
                              alt={drama.title} 
                              className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-90"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                            
                            {/* Overlay Badges */}
                            <div className="absolute top-4 left-4 flex gap-2">
                              <span className="px-3 py-1 rounded-full text-[10px] font-bold bg-onda-orange text-white shadow-md">
                                {drama.genre}
                              </span>
                            </div>

                            <div className="absolute top-4 right-4">
                              <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-black/60 backdrop-blur-md text-white border border-white/20">
                                {drama.views}
                              </span>
                            </div>

                            {/* Play Overlay Button */}
                            <button 
                              onClick={() => setSelectedDrama(drama)}
                              className="absolute inset-0 m-auto w-16 h-16 rounded-full bg-onda-orange/90 text-white flex items-center justify-center shadow-2xl transform group-hover:scale-110 transition-all"
                            >
                              <i data-lucide="play" className="w-8 h-8 fill-current ml-1"></i>
                            </button>

                            {/* Bottom Card Info Overlay */}
                            <div className="absolute bottom-4 left-4 right-4">
                              <h4 className="text-xl font-black text-white">{drama.title}</h4>
                              <p className="text-xs text-onda-orange font-semibold mt-0.5">{drama.episodes} {t.microdrama.episodes}</p>
                            </div>
                          </div>

                          <div className="p-5">
                            <p className="text-xs text-slate-300 leading-relaxed">{drama.desc}</p>
                            <div className="mt-3 pt-3 border-t border-slate-700/60">
                              <span className="text-[11px] font-bold text-slate-400 block uppercase tracking-wider">{t.microdrama.cast}:</span>
                              <span className="text-xs font-semibold text-white mt-0.5 block">{drama.cast}</span>
                            </div>
                          </div>
                        </div>

                        <div className="p-5 pt-0">
                          <button 
                            onClick={() => setSelectedDrama(drama)}
                            className="w-full py-3 rounded-xl bg-slate-700 hover:bg-onda-orange text-white font-bold text-xs transition-colors flex items-center justify-center gap-2"
                          >
                            <i data-lucide="smartphone" className="w-4 h-4"></i>
                            {t.microdrama.playPreview}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Selling Pitch CTA Banner */}
                <div className="mt-16 bg-gradient-to-r from-onda-blue to-onda-darkblue p-8 md:p-10 rounded-3xl text-center shadow-2xl border border-onda-blue/40 flex flex-col md:flex-row items-center justify-between gap-6">
                  <div className="text-left max-w-2xl">
                    <h3 className="text-2xl font-bold text-white">{t.microdrama.ctaTitle}</h3>
                    <p className="text-sm text-slate-100 mt-2">{t.microdrama.ctaDesc}</p>
                  </div>
                  <button 
                    onClick={() => handleContactSelect('Produzione Serie Microdrama')}
                    className="w-full md:w-auto px-8 py-4 bg-onda-orange hover:bg-amber-600 text-white font-bold text-sm rounded-2xl transition-all shadow-lg whitespace-nowrap"
                  >
                    {t.microdrama.ctaBtn}
                  </button>
                </div>

              </div>
            </section>

            {}
            <section id="servizi" className="py-20 bg-slate-50">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-3xl mx-auto">
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                    {t.services.title}
                  </h2>
                  <p className="mt-3 text-lg text-slate-600">
                    {t.services.subtitle}
                  </p>
                </div>

                <div className="mt-14 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                  <div className="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm hover:border-onda-blue transition-all group">
                    <div className="w-12 h-12 rounded-2xl bg-onda-blue/10 text-onda-blue flex items-center justify-center mb-6 group-hover:bg-onda-blue group-hover:text-white transition-colors">
                      <i data-lucide="star" className="w-6 h-6"></i>
                    </div>
                    <h3 className="font-bold text-lg text-slate-900">{t.services.s1Title}</h3>
                    <p className="text-xs text-slate-600 mt-3 leading-relaxed">{t.services.s1Desc}</p>
                  </div>

                  <div className="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm hover:border-onda-orange transition-all group">
                    <div className="w-12 h-12 rounded-2xl bg-onda-orange/10 text-onda-orange flex items-center justify-center mb-6 group-hover:bg-onda-orange group-hover:text-white transition-colors">
                      <i data-lucide="trending-up" className="w-6 h-6"></i>
                    </div>
                    <h3 className="font-bold text-lg text-slate-900">{t.services.s2Title}</h3>
                    <p className="text-xs text-slate-600 mt-3 leading-relaxed">{t.services.s2Desc}</p>
                  </div>

                  <div className="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm hover:border-onda-blue transition-all group">
                    <div className="w-12 h-12 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center mb-6 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                      <i data-lucide="clapperboard" className="w-6 h-6"></i>
                    </div>
                    <h3 className="font-bold text-lg text-slate-900">{t.services.s3Title}</h3>
                    <p className="text-xs text-slate-600 mt-3 leading-relaxed">{t.services.s3Desc}</p>
                  </div>

                  <div className="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm hover:border-onda-orange transition-all group">
                    <div className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-6 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                      <i data-lucide="ticket" className="w-6 h-6"></i>
                    </div>
                    <h3 className="font-bold text-lg text-slate-900">{t.services.s4Title}</h3>
                    <p className="text-xs text-slate-600 mt-3 leading-relaxed">{t.services.s4Desc}</p>
                  </div>
                </div>
              </div>
            </section>

            {}
            <section id="team" className="py-20 bg-white border-b border-slate-100">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-3xl mx-auto">
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                    {t.team.title}
                  </h2>
                  <p className="mt-3 text-lg text-slate-600">
                    {t.team.subtitle}
                  </p>
                </div>

                <div className="mt-14 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {MANAGEMENT_TEAM.map((member, idx) => (
                    <div key={idx} className="bg-slate-50 p-6 rounded-2xl border border-slate-200/80 shadow-sm text-center flex flex-col items-center">
                      <img 
                        src={member.avatar} 
                        alt={member.name} 
                        className="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md mb-4"
                      />
                      <h3 className="font-bold text-slate-900 text-base">{member.name}</h3>
                      <p className="text-xs font-semibold text-onda-blue mt-0.5">{member.role}</p>
                      
                      <a 
                        href={`mailto:${member.email}`}
                        className="mt-4 text-xs text-slate-500 hover:text-onda-orange flex items-center gap-1.5 transition-colors font-medium break-all"
                      >
                        <i data-lucide="mail" className="w-3.5 h-3.5 flex-shrink-0"></i>
                        <span>{member.email}</span>
                      </a>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {}
            <section id="contatti" className="py-20 bg-slate-50">
              <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                
                <div className="bg-white p-8 sm:p-12 rounded-3xl border border-slate-200 shadow-xl">
                  <div className="text-center max-w-2xl mx-auto">
                    <span className="text-xs font-bold uppercase tracking-widest text-onda-orange">Onda Agency Contact</span>
                    <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 mt-2">
                      {t.contact.title}
                    </h2>
                    <p className="mt-3 text-sm text-slate-600">
                      {t.contact.subtitle}
                    </p>
                  </div>

                  {formSubmitted ? (
                    <div className="mt-8 bg-emerald-50 border border-emerald-200 p-6 rounded-2xl text-center text-emerald-800">
                      <i data-lucide="check-circle" className="w-12 h-12 text-emerald-500 mx-auto mb-3"></i>
                      <p className="font-bold text-base">{t.contact.successMsg}</p>
                    </div>
                  ) : (
                    <form onSubmit={handleFormSubmit} className="mt-10 space-y-5">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-2">{t.contact.formName}</label>
                          <input 
                            type="text" 
                            required
                            placeholder="Mario Rossi" 
                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-onda-blue focus:bg-white transition-all"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-2">{t.contact.formEmail}</label>
                          <input 
                            type="email" 
                            required
                            placeholder="mario@azienda.it" 
                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-onda-blue focus:bg-white transition-all"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-2">{t.contact.formType}</label>
                        <select 
                          value={contactFormType}
                          onChange={(e) => setContactFormType(e.target.value)}
                          className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-onda-blue focus:bg-white transition-all"
                        >
                          <option value="Influencer Campaign">{t.contact.type1}</option>
                          <option value="Produzione Serie Microdrama">{t.contact.type2}</option>
                          <option value="Talent Management">{t.contact.type3}</option>
                          <option value="Partnership Strategica">{t.contact.type4}</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-2">{t.contact.formMessage}</label>
                        <textarea 
                          rows="4" 
                          required
                          placeholder="Descrivi brevemente gli obiettivi della campagna o il concept da realizzare..."
                          className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-onda-blue focus:bg-white transition-all resize-none"
                        ></textarea>
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-4 bg-onda-orange hover:bg-amber-600 text-white font-bold text-sm rounded-xl transition-all shadow-lg shadow-onda-orange/20"
                      >
                        {t.contact.formSubmit}
                      </button>
                    </form>
                  )}

                </div>

              </div>
            </section>

          </main>

          {}
          {selectedTalent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-100 max-h-[90vh] flex flex-col justify-between">
                
                <div className="relative h-64 bg-slate-800">
                  <img src={selectedTalent.avatar} alt={selectedTalent.name} className="w-full h-full object-cover" />
                  <button 
                    onClick={() => setSelectedTalent(null)}
                    className="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-900/70 text-white flex items-center justify-center hover:bg-slate-900 transition-colors"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                  <div className="absolute bottom-4 left-4">
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-white text-slate-900 shadow-md">
                      {selectedTalent.category}
                    </span>
                  </div>
                </div>

                <div className="p-6 overflow-y-auto space-y-4">
                  <div>
                    <h3 className="text-2xl font-black text-slate-900">{selectedTalent.name}</h3>
                    <p className="text-xs font-semibold text-onda-orange mt-0.5">{selectedTalent.badge}</p>
                  </div>

                  <p className="text-sm text-slate-600 leading-relaxed">
                    {selectedTalent.bio}
                  </p>

                  <div className="space-y-2 pt-2">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Social Channels Direct Links</p>
                    
                    <a 
                      href={selectedTalent.igUrl} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="flex items-center justify-between p-3 rounded-xl bg-pink-50 hover:bg-pink-100 text-pink-900 transition-colors text-xs font-bold"
                    >
                      <div className="flex items-center gap-2">
                        <i data-lucide="instagram" className="w-4 h-4 text-onda-fuchsia"></i>
                        <span>Instagram: @{selectedTalent.igHandle}</span>
                      </div>
                      <span>{selectedTalent.igFollowers}</span>
                    </a>

                    <a 
                      href={selectedTalent.ttUrl} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="flex items-center justify-between p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-900 transition-colors text-xs font-bold"
                    >
                      <div className="flex items-center gap-2">
                        <i data-lucide="video" className="w-4 h-4 text-slate-900"></i>
                        <span>TikTok: @{selectedTalent.ttHandle}</span>
                      </div>
                      <span>{selectedTalent.ttFollowers}</span>
                    </a>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
                  <button 
                    onClick={() => {
                      setSelectedTalent(null);
                      handleContactSelect('Influencer Campaign');
                    }}
                    className="w-full py-3 bg-onda-orange text-white font-bold text-xs rounded-xl shadow-md hover:bg-amber-600 transition-colors"
                  >
                    Richiedi Booking / Proposal
                  </button>
                </div>

              </div>
            </div>
          )}

          {}
          {selectedDrama && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="bg-slate-900 rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl border border-slate-800 relative">
                
                {/* Simulated 9:16 Vertical Video Screen */}
                <div className="relative aspect-[9/16] bg-black flex items-center justify-center">
                  <img src={selectedDrama.poster} alt={selectedDrama.title} className={`w-full h-full object-cover ${isPlayingVideo ? 'scale-105 filter brightness-110' : 'filter brightness-75'} transition-all duration-700`} />
                  
                  {!isPlayingVideo ? (
                    <button 
                      onClick={() => setIsPlayingVideo(true)}
                      className="absolute w-20 h-20 rounded-full bg-onda-orange text-white flex items-center justify-center shadow-2xl transform hover:scale-110 transition-all z-20"
                    >
                      <i data-lucide="play" className="w-10 h-10 fill-current ml-1"></i>
                    </button>
                  ) : (
                    <div className="absolute top-4 left-4 z-20 bg-emerald-500 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full animate-pulse">
                      PLAYING PREVIEW 9:16
                    </div>
                  )}

                  <button 
                    onClick={() => {
                      setSelectedDrama(null);
                      setIsPlayingVideo(false);
                    }}
                    className="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>

                  <div className="absolute bottom-4 left-4 right-4 z-20 text-white">
                    <span className="text-[10px] font-bold bg-onda-orange px-2 py-0.5 rounded text-white">{selectedDrama.genre}</span>
                    <h4 className="text-xl font-black mt-1">{selectedDrama.title}</h4>
                    <p className="text-xs text-slate-300 mt-1">Cast: {selectedDrama.cast}</p>
                  </div>
                </div>

                <div className="p-4 bg-slate-800 text-center">
                  <button 
                    onClick={() => {
                      setSelectedDrama(null);
                      setIsPlayingVideo(false);
                      handleContactSelect('Produzione Serie Microdrama');
                    }}
                    className="w-full py-3 bg-onda-blue hover:bg-onda-darkblue text-white font-bold text-xs rounded-xl transition-colors"
                  >
                    Proponi la tua Serie Branded
                  </button>
                </div>

              </div>
            </div>
          )}

          {}
          <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
              
              <div className="flex flex-col items-center md:items-start gap-2">
                <OndaLogo className="h-8 w-auto text-white" />
                <p className="mt-2 text-slate-500">{t.footer.address}</p>
              </div>

              <div className="flex items-center gap-6 font-semibold">
                <a href="#roster" className="hover:text-white transition-colors">{t.nav.roster}</a>
                <a href="#microdrama" className="hover:text-white transition-colors">{t.nav.microdrama}</a>
                <a href="#servizi" className="hover:text-white transition-colors">{t.nav.services}</a>
                <a href="#contatti" className="hover:text-white transition-colors">{t.nav.contact}</a>
              </div>

              <div className="text-center md:text-right text-slate-500">
                <p>© 2026 Onda Agency. {t.footer.rights}</p>
                <p className="mt-1 text-[11px] text-slate-600">Milano Talent Hub • Microdrama Production</p>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Render App Component into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
